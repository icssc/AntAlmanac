name: Label pull request

# Do not check out, build, or execute code in this workflow. pull_request_target can be dangerous.
on:
    pull_request_target:
        types: [opened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label:
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Run labeler
              uses: actions/labeler@v7
              with:
                  sync-labels: true
