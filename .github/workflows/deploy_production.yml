name: Deploy - Production

on:
    push:
        branches: [main]
        paths-ignore:
            - 'apps/ios/**'

concurrency:
    group: sst-production
    cancel-in-progress: false

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}

    ANTEATER_API_KEY: ${{ secrets.ANTEATER_API_KEY }}
    OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
    NEXT_PUBLIC_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_PUBLIC_POSTHOG_KEY }}
    NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

    BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    DB_URL: ${{ secrets.PROD_DB_URL }}
    MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
    NEXT_PUBLIC_TILES_ENDPOINT: ${{ secrets.NEXT_PUBLIC_TILES_ENDPOINT }}
    OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}

    PLANNER_OIDC_CLIENT_ID: ${{ secrets.PLANNER_OIDC_CLIENT_ID }}
    ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    PLANNER_DATABASE_URL: ${{ secrets.PLANNER_PROD_DATABASE_URL }}
    PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
    PLANNER_SESSION_SECRET: ${{ secrets.PLANNER_SESSION_SECRET }}

    PLANNER_CLIENT_API_KEY: ${{ secrets.PLANNER_CLIENT_API_KEY }}

jobs:
    deploy-production:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-and-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Migrate database
              env:
                  DB_URL: ${{ secrets.PROD_DB_URL }}
              run: pnpm sched:db:migrate

            - name: Generate termData
              uses: ./.github/actions/cache-generated-data
              with:
                  api-key: ${{ secrets.ANTEATER_API_KEY }}

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: apps/antalmanac/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/antalmanac/src/**') }}-${{ hashFiles('apps/antalmanac-planner/site/src/**') }}-${{ hashFiles('apps/antalmanac-scheduler/site/src/**') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
                      ${{ runner.os }}-nextjs-

            - name: Deploy SST (production)
              env:
                  SST_STAGE: production
              run: |
                  npx sst deploy --stage "$SST_STAGE"
