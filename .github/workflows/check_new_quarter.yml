name: Check and deploy new quarter

on:
    schedule:
        - cron: '0 * * * *'
    workflow_dispatch:

env:
    ANTEATER_API_KEY: ${{ secrets.ANTEATER_API_KEY }}
    STATE_FILE: deployed-terms.txt
    STATE_KEY: deployed-terms-${{ github.run_id }}

permissions:
    contents: read

concurrency:
    group: check-new-quarter
    cancel-in-progress: false

jobs:
    check-quarters:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.compare.outputs.changed }}
            state: ${{ steps.compare.outputs.state }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Validate API key
              run: |
                  if [ -z "$ANTEATER_API_KEY" ]; then
                      echo "ANTEATER_API_KEY secret is not set"
                      exit 1
                  fi

            - name: Setup Node and pnpm
              uses: ./.github/actions/setup-node-and-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Get latest term
              id: latest
              run: pnpm --filter antalmanac get-latest-term

            - name: Restore last deployed state
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.STATE_FILE }}
                  key: ${{ env.STATE_KEY }}
                  restore-keys: deployed-terms-

            - name: Compare with last deployed state
              id: compare
              env:
                  CURRENT_STATE: ${{ steps.latest.outputs.latest-term }} ${{ steps.latest.outputs.section-count }}
              run: |
                  previous_state=$(cat "$STATE_FILE" 2>/dev/null || true)
                  echo "Last deployed: ${previous_state:-<none>}"
                  echo "Current: $CURRENT_STATE"
                  echo "state=$CURRENT_STATE" >> "$GITHUB_OUTPUT"
                  if [ "$previous_state" = "$CURRENT_STATE" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        needs: check-quarters
        if: needs.check-quarters.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
        uses: ./.github/workflows/deploy_production.yml
        secrets: inherit

    # Runs only after a successful deploy, so a failed deploy is retried on the next run.
    save-deployed-state:
        needs: [check-quarters, deploy]
        runs-on: ubuntu-latest
        steps:
            - name: Write deployed state
              env:
                  DEPLOYED_STATE: ${{ needs.check-quarters.outputs.state }}
              run: printf '%s\n' "$DEPLOYED_STATE" > "$STATE_FILE"

            - name: Save deployed state
              uses: actions/cache/save@v5
              with:
                  path: ${{ env.STATE_FILE }}
                  key: ${{ env.STATE_KEY }}

            # actions/cache/save only logs a warning when saving fails.
            - name: Confirm deployed state was saved
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.STATE_FILE }}
                  key: ${{ env.STATE_KEY }}
                  lookup-only: true
                  fail-on-cache-miss: true
