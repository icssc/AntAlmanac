name: Deploy - Staging Shared

on:
    repository_dispatch:
        types: [deploy-shared-command]

concurrency:
    group: sst-staging-shared
    cancel-in-progress: false

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}

    ANTEATER_API_KEY: ${{ secrets.ANTEATER_API_KEY }}
    OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
    NEXT_PUBLIC_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_PUBLIC_POSTHOG_KEY }}
    NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

    BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    DB_URL: ${{ secrets.DEV_DB_URL }}
    MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
    NEXT_PUBLIC_TILES_ENDPOINT: ${{ secrets.NEXT_PUBLIC_TILES_ENDPOINT }}
    OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}

    PLANNER_OIDC_CLIENT_ID: ${{ secrets.PLANNER_OIDC_CLIENT_ID }}
    ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    PLANNER_DATABASE_URL: ${{ secrets.PLANNER_DEV_DATABASE_URL }}
    PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
    PLANNER_SESSION_SECRET: ${{ secrets.PLANNER_SESSION_SECRET }}

    PLANNER_CLIENT_API_KEY: ${{ secrets.PLANNER_CLIENT_API_KEY }}

jobs:
    deploy-staging-shared:
        if: github.event.client_payload.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        env:
            SST_STAGE: staging-shared

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.client_payload.pull_request.head.sha }}

            - name: Create deployment
              id: create-deployment
              uses: chrnorm/deployment-action@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  environment: staging-shared
                  ref: ${{ github.event.client_payload.pull_request.head.sha }}
                  description: Staging deployment for PR #${{ github.event.client_payload.pull_request.number }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-and-pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Migrate database
              env:
                  DB_URL: ${{ secrets.DEV_DB_URL }}
              run: pnpm db:migrate

            - name: Generate termData
              uses: ./.github/actions/cache-generated-data
              with:
                  api-key: ${{ secrets.ANTEATER_API_KEY }}

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: apps/antalmanac/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/antalmanac/src/**') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
                      ${{ runner.os }}-nextjs-

            - name: Deploy SST (staging)
              id: deploy
              run: |
                  echo "Deploying stage: $SST_STAGE"
                  npx sst deploy --stage "$SST_STAGE"

            - name: Update deployment status (success)
              if: success()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  deployment-id: ${{ steps.create-deployment.outputs.deployment_id }}
                  state: success
                  environment-url: https://staging-shared.antalmanac.com

            - name: Add reaction to comment
              if: github.event_name == 'repository_dispatch'
              uses: peter-evans/create-or-update-comment@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
                  reactions: rocket

            - name: Update deployment status (failure)
              if: failure()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  deployment-id: ${{ steps.create-deployment.outputs.deployment_id }}
                  state: failure
