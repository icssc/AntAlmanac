name: antalmanac

services:
    db:
        build:
            context: packages/db
            dockerfile: Dockerfile
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: antalmanac
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d antalmanac']
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s
